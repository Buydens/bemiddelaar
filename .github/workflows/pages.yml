name: Publiceer feedbackdemo op GitHub Pages

# Publiceert uitsluitend de inhoud van feedback-demo/ — de geschoonde
# publicatiebundel. De overige prototypes in de hoofdmap blijven offline.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages configureren
        uses: actions/configure-pages@v5
        with:
          # Zet Pages automatisch aan als dat nog niet gebeurd is
          enablement: true

      - name: Bundel uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: feedback-demo

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
